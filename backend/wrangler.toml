name = "ratedbrokers-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat is needed by @anthropic-ai/sdk (Buffer, streams).
# Bumping compat_date to 2024-09-23 (the date this flag became GA) is the
# narrowest possible change — it does not alter any existing Worker behavior
# we currently rely on (no cron semantics or fetch defaults are affected).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Allow .md text imports — used by Freshness Pipeline (S3) to load
# agents/*.md prompts as bundled string assets at build time.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

routes = [
  { pattern = "api.ratedbrokers.com/*", zone_name = "ratedbrokers.com" }
]

[vars]
FRONTEND_URL = "https://ratedbrokers.com"
# API_KEY is set via `wrangler secret put API_KEY` in production.
# For local dev, set it here or via .dev.vars file:
# API_KEY = "dev-test-key"

# Cron Trigger — auto-publish scheduled pages every hour
[triggers]
crons = ["0 * * * *"]

# Smart Placement — run Worker close to D1 database for faster queries
[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "ratedbrokers"
database_id = "0583b2f5-4bba-4d05-868a-1228a109668e"

# ─── Staging Environment ───
# Deploy: cd backend && npx wrangler deploy --env staging
# Access: https://ratedbrokers-api-staging.ratedbrokers.workers.dev
[env.staging]
name = "ratedbrokers-api-staging"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[env.staging.vars]
FRONTEND_URL = "https://ratedbrokers.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ratedbrokers"
database_id = "0583b2f5-4bba-4d05-868a-1228a109668e"
